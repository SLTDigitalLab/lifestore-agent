name: lifestore-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifestore
      POSTGRES_DB: lifestore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifestore -d lifestore"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: .
    # Payment link query strings contain tokens; do not retain them in access logs.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CHAT_TEST_TOKEN: ${CHAT_TEST_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_MODE: ${PAYHERE_MODE:-sandbox}
      PAYHERE_PUBLIC_BASE_URL: ${PAYHERE_PUBLIC_BASE_URL:?Set the public HTTPS base URL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS hostname}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$$
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/${NGINX_CONFIG:-https}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - acme_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - acme_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    logging: *logging

volumes:
  postgres_data:
  acme_webroot:
  letsencrypt:
